name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: apaise

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Synchroniser l'app
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: apaise/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apaise-apk
          path: apaise/android/app/build/outputs/apk/debug/app-debug.apk
